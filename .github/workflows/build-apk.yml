name: Build Status Duo APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'StatusDuo-3.1.0-AndroidProject.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Extract project
        run: |
          mkdir -p project
          unzip -q StatusDuo-3.1.0-AndroidProject.zip -d project
          find project -maxdepth 3 -type f | head -50

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          PROJECT_DIR=$(find project -type f -name settings.gradle -o -name settings.gradle.kts | head -1)
          PROJECT_DIR=$(dirname "$PROJECT_DIR")
          echo "Project: $PROJECT_DIR"
          gradle -p "$PROJECT_DIR" :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StatusDuo-3.1.0-debug
          path: 'project/**/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
