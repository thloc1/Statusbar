name: Build Status Duo APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'StatusDuo-3.1.0-AndroidProject.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: unzip -q StatusDuo-3.1.0-AndroidProject.zip -d project

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          gradle -p project/StatusDuo-3.1.0-AndroidProject \
            :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StatusDuo-3.1.0-debug
          path: project/StatusDuo-3.1.0-AndroidProject/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
